name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test HWID algorithm
        shell: pwsh
        run: ./tests/run-hwid-tests.ps1

      - name: Test update checker
        shell: pwsh
        run: ./tests/run-update-tests.ps1

      - name: Test service state policies
        shell: pwsh
        run: ./tests/run-service-policy-tests.ps1

      - name: Build standalone EXE
        shell: pwsh
        run: ./build.ps1

      - name: Upload unsigned PR test build
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ServicesPrechecker-win-x64-unsigned-test-build
          path: |
            dist/ServicesPrechecker-v*.exe
            dist/ServicesPrechecker-v*.exe.sha256
